services:
  - type: web
    name: running-load-analyzer
    env: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: running-load-analyzer-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_REDIRECT_URI
        sync: false
      - key: RAILS_LOG_LEVEL
        value: info

databases:
  - name: running-load-analyzer-db
    plan: free
    databaseName: running_load_analyzer_production
    user: running_load_analyzer
